name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Build and start reviewer stack with synthetic data
        env:
          DATASET_PATH: /app/data/fixtures/profiles.synthetic.csv
        run: docker compose up --build --wait --wait-timeout 300

      - name: Migrate isolated integration schema
        env:
          DATABASE_URL: postgresql://profiles:profiles@localhost:55432/profiles?schema=integration
        run: pnpm --filter api prisma:migrate:deploy

      - name: Run API integration tests
        env:
          INTEGRATION_DATABASE_URL: postgresql://profiles:profiles@localhost:55432/profiles?schema=integration
          INTEGRATION_ELASTICSEARCH_NODE: http://localhost:9200
        run: pnpm --filter api test:integration

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run browser scenario
        run: pnpm --filter web test:e2e

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop reviewer stack
        if: always()
        run: docker compose down --volumes
