name: profile-search

x-api-service: &api-service
  image: profile-search-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &api-environment
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgresql://profiles:profiles@postgres:5432/profiles
    ELASTICSEARCH_NODE: http://elasticsearch:9200
    ELASTICSEARCH_USERNAME: ''
    ELASTICSEARCH_PASSWORD: ''
    ELASTICSEARCH_INDEX_ALIAS: profiles-read
    WEB_ORIGIN: http://localhost:8080
    DATASET_PATH: '${DATASET_PATH:-/app/data/raw/300 user linkedin.txt}'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profiles
      POSTGRES_USER: profiles
      POSTGRES_PASSWORD: profiles
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U profiles -d profiles']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  migrate:
    <<: *api-service
    command: ['pnpm', '--filter', 'api', 'prisma:migrate:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  import:
    <<: *api-service
    command: ['node', 'apps/api/dist/ingestion/import.command.js']
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  reindex:
    <<: *api-service
    command: ['node', 'apps/api/dist/search/reindex.command.js']
    depends_on:
      import:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-service
    ports:
      - '3000:3000'
    depends_on:
      reindex:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: profile-search-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  elasticsearch-data:
